protocol_version: dino_attack_structured_set_v1
streams:
  - name: Global
    shape: [3]
    fields: [remaining_time, food_normalized, last_action_valid]
  - name: Walls
    shape: [6, 5]
    fields: [valid_mask, active, x_norm, z_norm, health_ratio]
  - name: Guards
    shape: [8, 7]
    fields: [valid_mask, type_archer, type_mage, x_norm, z_norm, health_ratio, is_wall_guard]
  - name: Houses
    shape: [8, 6]
    fields: [valid_mask, alive, x_norm, z_norm, health_ratio, max_health_normalized]
  - name: Dinos
    shape: [10, 7]
    fields: [valid_mask, type_velociraptor, type_pachy, type_trex, x_norm, z_norm, health_ratio]
maxima:
  walls: 6
  guards: 8
  houses: 8
  dinos: 10
normalization:
  map_bounds:
    x: [-55.5, 48.5]
    z: [-53.0, 29.0]
  food_scale: 5000.0
  house_health_scale: 325.0
regions:
  vertex_order: [A, B, C, D]
  zones:
    - id: Z1RuinsForecourt
      vertices: [[-27.0, 0.0, -44.0], [-27.0, 0.0, -25.0], [-50.0, 0.0, -16.0], [-52.0, 0.0, -49.0]]
    - id: Z2OpenMeadow
      vertices: [[-25.0, 0.0, -19.0], [-13.0, 0.0, -17.0], [-22.0, 0.0, 18.0], [-44.0, 0.0, 7.0]]
    - id: Z3RiverTerrace
      vertices: [[-10.0, 0.0, -17.0], [7.0, 0.0, -17.0], [14.0, 0.0, 27.0], [-18.0, 0.0, 27.0]]
    - id: Z4PalmGrove
      vertices: [[10.0, 0.0, -18.0], [22.0, 0.0, -21.0], [43.0, 0.0, 5.0], [20.0, 0.0, 18.0]]
    - id: Z5RockyShelf
      vertices: [[23.0, 0.0, -44.0], [23.0, 0.0, -25.0], [46.0, 0.0, -17.0], [48.0, 0.0, -48.0]]
action:
  version: dino_attack_structured_set_action_v1
  size: 4
  dtype: float32
  range: [-1.0, 1.0]
  dimensions: [zone, u, v, choice]
  zone_order: [Z1RuinsForecourt, Z2OpenMeadow, Z3RiverTerrace, Z4PalmGrove, Z5RockyShelf]
  zone_thresholds: [-0.6, -0.2, 0.2, 0.6]
  choice_order: [Wait, Velociraptor, Pachycephalosaurus, T-Rex]
  choice_thresholds: [-0.5, 0.0, 0.5]
  boundary_rule: equality_enters_higher_bin
  wait_ignores: [zone, u, v]
